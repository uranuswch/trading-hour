market: KRX
timezone: Asia/Seoul
weekly_schedule:
  monday: &kr_full
    - {session: premarket,  start: "08:00", end: "09:00"}
    - {session: regular,    start: "09:00", end: "15:30"}
    - {session: postmarket, start: "15:40", end: "18:00"}
  tuesday: *kr_full
  wednesday: *kr_full
  thursday: *kr_full
  friday: *kr_full
  saturday: []
  sunday: []

# From 2026-09-14, continuous after-market trading runs 16:00-20:00 KST.
# Keep closing-price trading (15:40-16:00) in the same postmarket phase.
# The new after-market excludes ETFs, ETNs, and other ineligible securities.
# Sources:
# https://global.krx.co.kr/contents/GLB/06/0602/0602020204/GLB0602020204T1.jsp
# https://www.samsungpop.com/ux/kor/customer/notice/notice/noticeViewContent.do?MenuSeqNo=24420
weekly_schedule_overrides:
  - effective_from: "2026-09-14"
    weekly_schedule:
      monday: &kr_extended
        - {session: premarket,  start: "08:00", end: "09:00"}
        - {session: regular,    start: "09:00", end: "15:30"}
        - {session: postmarket, start: "15:40", end: "20:00"}
      tuesday: *kr_extended
      wednesday: *kr_extended
      thursday: *kr_extended
      friday: *kr_extended
      saturday: []
      sunday: []
